[project]
name = "hwformer"
version = "0.1.0"
description = "A small from-scratch transformer exercise for birds-vs-reptiles text classification, MLM, and embedding visualization."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.1.0",
    "marimo>=0.23.6",
    "matplotlib>=3.10.9",
    "numpy>=2.4.5",
    "pandas>=3.0.3",
    "scikit-learn>=1.8.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
]
